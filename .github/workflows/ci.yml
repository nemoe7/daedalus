name: CI

on:
  push:
    branches: [main]
    # Steering syncs carry no shipped code, so their pushes skip CI and never
    # cancel a code run through the concurrency group below.
    paths-ignore: &steering
      - ".agents/**"
      - "ARENA.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore: *steering

# A new push stops the older run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Check documentation prose
        run: >-
          uv run --no-sync python -c
          "from scripts.lint_prose import page_files, scan, long_blocks, long_sentences;
          pages = page_files();
          raise SystemExit(bool(scan(pages) + long_blocks(pages) + long_sentences(pages)))"
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      # pyproject.toml sets the pytest workers: 1 for each CPU. All the tests of 1 file run in 1 worker.
      - run: uv run --no-sync pytest
