name: Pages demo

on:
  push:
    branches: [main]
    paths:
      - "daedalus/dashboard/ui/**"
      - "scripts/pages_demo.py"
      - "scripts/pages_fixtures.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 1 deploy at a time. A run in flight finishes, so the site never goes empty.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The script is stdlib plus the test client, and the page shows this version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/pages_demo.py --out _site
        env:
          DAEDALUS_VERSION: demo
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
