[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuu"
version = "0.1.16"
description = "Design sheet and UI/UX inspection CLI."
requires-python = ">=3.10"

[project.scripts]
nuu = "nuu:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["nuu", "uiux", "measure", "annotate"]
