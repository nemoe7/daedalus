# For `alembic revision --autogenerate` in development. `daedalus serve` does not read this file.
# uv run alembic -c daedalus/store/alembic.ini upgrade head
# uv run alembic -c daedalus/store/alembic.ini revision --autogenerate -m "add a column"
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///.daedalus-state/models.sqlite3

# ruff formats each new step to the repo style.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix -q REVISION_SCRIPT_FILENAME
