name: CI

on:
  push:
    branches: [main]
    # Steering syncs carry no shipped code, so their pushes skip CI and never
    # cancel a code run through the concurrency group below.
    paths-ignore: &steering
      - ".agents/**"
      - "ARENA.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore: *steering

# A new push stops the older run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/lint_prose.py
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      # pyproject.toml sets the pytest workers: 1 for each CPU. All the tests of 1 file run in 1 worker.
      - run: uv run --no-sync pytest

  # Browser checks for the dashboard demo. The suite serves the built demo on
  # port 8011 and drives it with Chromium from the Playwright bundle.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser checks
        working-directory: tests/e2e
        env:
          DEMO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx playwright test
