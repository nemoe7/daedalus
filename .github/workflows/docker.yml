name: Docker

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI", "Gemini Release Draft"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Whether to publish the rolling dev image or a release
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev
      tag:
        description: Release tag to build, such as v1.2.3. Release mode only
        required: false
        type: string

# Least privilege at the top. Each job asks for packages: write where it publishes.
permissions:
  contents: read

# Native runners build each platform image and push digests for the manifest list.
# Main CI runs publish the rolling dev image and cancel older dev builds.
jobs:
  changes:
    name: Image Paths
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'CI'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - id: filter
        name: Read the files changed since the last dev build
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # A manual dev run states its own intent, so it always builds.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'build=yes\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          base=""
          while read -r run_id head_sha; do
            [[ -z "$run_id" ]] && continue
            merged="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "dev-merge" and .conclusion == "success") | .conclusion')"
            if [[ "$merged" == "success" ]] && git cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              base="$head_sha"
              break
            fi
          done <<<"$runs"

          if [[ -z "$base" ]]; then
            printf 'build=yes\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The image ships the package, its config, the hooks, and the lock.
          # Non-image commits since the last dev publish leave the image unchanged.
          files="$(git diff --name-only "$base" "$SHA")"
          build=no
          while IFS= read -r file; do
            case "$file" in
              daedalus/* | config/* | hooks/* | pyproject.toml | uv.lock | Dockerfile | .dockerignore)
                build=yes
                ;;
            esac
          done <<<"$files"
          printf 'build=%s\n' "$build" >>"$GITHUB_OUTPUT"

  dev:
    if: >-
      ((github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'CI'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dev'))
      && needs.changes.outputs.build == 'yes'
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Publishing to GHCR needs more than read, so the job asks for it here.
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: docker-dev-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # `main` is a fixed, trusted ref. The tested commit must be an ancestor of
      # `main` before the build detaches at that exact commit.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Pin the tested commit
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA: $EXPECTED" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED" HEAD; then
            echo "$EXPECTED is not on main ($(git rev-parse HEAD))" >&2
            exit 1
          fi
          git checkout --detach "$EXPECTED"

      - id: dev
        name: Resolve Dev Version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          short="$(git rev-parse --short "$SHA")"
          printf 'short=%s\n' "$short" >>"$GITHUB_OUTPUT"
          printf 'version=dev-%s\n' "$short" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ steps.dev.outputs.version }}
      # A digest only: the merge job puts dev tags on the manifest list.
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.dev.outputs.version }}
          # A plain manifest for each platform: no attestation entry hides behind the digest.
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}
      - name: Export the Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-dev-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The 2 digests land under 1 manifest list with the dev tags.
  dev-merge:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: docker-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - id: dev
        name: Resolve Dev Version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          short="$(git rev-parse --short "$SHA")"
          printf 'short=%s\n' "$short" >>"$GITHUB_OUTPUT"
          printf 'version=dev-%s\n' "$short" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digests-dev-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ steps.dev.outputs.version }}
      - name: Create the Manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # The flag and its tag ride as 2 argv entries, or buildx reads a bad reference.
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<<"${DOCKER_METADATA_OUTPUT_JSON:-{}}")
          if ((${#tag_args[@]} == 0)); then
            echo "The metadata output holds no tag" >&2
            exit 1
          fi
          shopt -s nullglob
          digests=()
          for file in *; do
            digests+=("${IMAGE}@sha256:${file}")
          done
          if ((${#digests[@]} == 0)); then
            echo "No digest landed in /tmp/digests" >&2
            exit 1
          fi
          printf 'tag %s\n' "${tag_args[@]}"
          printf 'digest %s\n' "${digests[@]}"
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"

      # The rolling dev tag moves, so each build leaves an old dev-COMMIT version behind.
      # Keep the newest 10. A release tag or latest never starts with dev-, so it stays.
      - name: Prune Old Dev Versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: 10
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          PACKAGE="${REPO#*/}"
          if gh api "orgs/$OWNER" >/dev/null 2>&1; then
            scope="orgs/$OWNER"
          else
            scope="users/$OWNER"
          fi
          versions="$scope/packages/container/$PACKAGE/versions"
          mapfile -t stale < <(
            gh api --paginate "$versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | any(startswith("dev-"))) | "\(.created_at) \(.id)"' \
              | sort -r | tail -n +$((KEEP + 1)) | cut -d' ' -f2
          )
          for id in "${stale[@]}"; do
            gh api --method DELETE "$versions/$id"
          done
          echo "Deleted ${#stale[@]} old dev versions."

  # Tag pushes and approved Gemini Release Draft runs publish release images one at a time.
  release:
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'Gemini Release Draft')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The approval and its log live in Actions, so the job reads them.
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - id: release
        name: Resolve Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag=""
          expected_sha=""
          skip="false"

          case "$EVENT_NAME" in
            push)
              tag="${GITHUB_REF_NAME}"
              ;;
            workflow_dispatch)
              tag="$DISPATCH_TAG"
              ;;
            workflow_run)
              if [[ "$RUN_CONCLUSION" != "success" ]]; then
                skip="true"
              else
                job_id="$(gh api --paginate \
                  "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                  --jq '.jobs[] | select(.name == "draft") | .id' | tail -n 1)"

                if [[ -z "$job_id" ]]; then
                  skip="true"
                else
                  approval_conclusion="$(gh api \
                    "repos/$REPOSITORY/actions/jobs/$job_id" \
                    --jq '.steps[] | select(.name == "Approve Proposal") | .conclusion' | tail -n 1)"

                  if [[ "$approval_conclusion" != "success" ]]; then
                    skip="true"
                  else
                    approval_line="$(gh api --allow-escape-sequences "repos/$REPOSITORY/actions/jobs/$job_id/logs" | \
                      sed -nE 's/.*Tag [\x60](v[0-9]+\.[0-9]+\.[0-9]+)[\x60] points to [\x60]([0-9a-f]{40})[\x60]\..*/\1 \2/p' | \
                      tail -n 1)"

                    if [[ -z "$approval_line" ]]; then
                      echo "Approved proposal tag not found in job logs" >&2
                      exit 1
                    fi

                    read -r tag expected_sha <<<"$approval_line"
                  fi
                fi
              fi
              ;;
          esac

          if [[ "$skip" != "true" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
            printf 'expected_sha=%s\n' "$expected_sha" >>"$GITHUB_OUTPUT"
          fi

          printf 'skip=%s\n' "$skip" >>"$GITHUB_OUTPUT"

  release-build:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Publishing to GHCR needs more than read, so the job asks for it here.
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: docker-release-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}

      - name: Verify Release Commit
        env:
          EXPECTED_SHA: ${{ needs.release.outputs.expected_sha }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-list -n 1 "$TAG^{commit}")"
          if [[ -n "$EXPECTED_SHA" && "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Tag $TAG points to $actual_sha, expected $EXPECTED_SHA" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
      # A digest only: the merge job puts release tags on the manifest list.
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release.outputs.tag }}
          # A plain manifest for each platform: no attestation entry hides behind the digest.
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Export the Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-release-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The 2 digests land under 1 manifest list with the release tag and latest.
  release-merge:
    needs: [release, release-build]
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: docker-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digests-release-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
      - name: Create the Manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # The flag and its tag ride as 2 argv entries, or buildx reads a bad reference.
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<<"${DOCKER_METADATA_OUTPUT_JSON:-{}}")
          if ((${#tag_args[@]} == 0)); then
            echo "The metadata output holds no tag" >&2
            exit 1
          fi
          shopt -s nullglob
          digests=()
          for file in *; do
            digests+=("${IMAGE}@sha256:${file}")
          done
          if ((${#digests[@]} == 0)); then
            echo "No digest landed in /tmp/digests" >&2
            exit 1
          fi
          printf 'tag %s\n' "${tag_args[@]}"
          printf 'digest %s\n' "${digests[@]}"
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"
