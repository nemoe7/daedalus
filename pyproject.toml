[project]
name = "daedalus"
version = "0.1.0"
description = "Local OpenAI-compatible proxy"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=11",
  "python-multipart>=0.0.18",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "sqlalchemy>=2.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx2>=2.13",
  "pytest>=9.1",
  "pytest-xdist>=3.8",
  "ruff==0.16.6",
]

[project.scripts]
daedalus = "daedalus.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "daedalus",
  "daedalus.catalog",
  "daedalus.config",
  "daedalus.dashboard",
  "daedalus.providers",
  "daedalus.routing",
  "daedalus.server",
  "daedalus.store",
]

[tool.setuptools.package-data]
"daedalus.store" = [
  "alembic.ini",
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
]
"daedalus.dashboard" = ["ui/*"]
"daedalus.routing" = ["artifacts/*.json", "artifacts/*-LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# loadfile: the tests of 1 file run in 1 worker, in file order, with its module fixtures.
addopts = "-n auto --dist loadfile -p no:cacheprovider"
