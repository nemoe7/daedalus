# The tier hint of the free.yml providers: it claims only what no provider block claims.
# The shared patterns of 2 or more provider blocks, so a new provider serves them in the same tiers.
_default:
  tier:
    TIER-A:
      - "nvidia/nemotron-3-super-*"
      - "poolside/laguna-s-*"
      - "thinkingmachines/inkling*"
      - "minimax/minimax-m3.1-flash*"
    TIER-C:
      - "recursive/flint-v1.0*"
      - "nvidia/nemotron-3.5-lightning*"
      - "nvidia/nemotron-3-nano-omni-*"
    TIER-D:
      - "liquid/lfm-2.5-2.6b*"
      - "liquid/lfm-3-1.7b*"

cloudflare:
  api_key: env:CLOUDFLARE_API_KEY
  account_id: env:CLOUDFLARE_ACCOUNT_ID
  # After the order 1 models: the daily Neurons go to images and transcription first.
  order: 2
  discovery_match:
    require_workers_paid: false
  exclude:
    - "*llama-guard*"
    - "*llama-3.2-11b-vision*"
    - "*phonellm*" # a voice-agent model: Workers AI lists it as text, and no tier claims it
  tier:
    TIER-A:
      - "*qwen3.*"
      - "*nemotron-3-120b-a12b*"
      - "@cf/qwen/qwq-32b"
    TIER-B:
      - "*qwen3-30b-a3b*"
      - "*deepseek-r1*"
      - "@cf/openai/gpt-oss-20b"
      - "@cf/zai-org/glm-4.7-flash"
      - "@cf/google/gemma-4-*"
      - "@cf/openai/gpt-oss-120b"
    TIER-C:
      - "@cf/meta/llama-3.3-70b-*"
      - "@cf/meta/llama-4-scout-*"
      - "@cf/mistralai/mistral-small-*"
      - "@cf/qwen/qwen2.5-coder-*"
      - "@cf/aisingapore/*"
    TIER-D:
      - "@cf/meta/llama-3.1-8b-*"
      - "@cf/meta/llama-3.2-*"
      - "@cf/ibm-granite/*"
      - "@cf/swiss-ai/*"
      - "@cf/utter-project/*"
      - "*-lora"

  models:
    "@cf/qwen/qwq-32b": { max_input_tokens: 20000, max_output_tokens: 4000, supported_reasoning_efforts: [max] }
    # Workers AI docs give gpt-oss low, medium, and high, and qwen3.8 low, medium, and xhigh.
    "@cf/openai/gpt-oss-120b": { supported_reasoning_efforts: [low, medium, high] }
    "@cf/openai/gpt-oss-20b": { supported_reasoning_efforts: [low, medium, high] }
    "@cf/qwen/qwen3.8-27b": { supported_reasoning_efforts: [low, medium, high] }
    # Workers AI docs give these 3 an on/off enable_thinking toggle: none turns it off, max keeps it on.
    "@cf/zai-org/glm-4.7-flash": { supported_reasoning_efforts: [none, max] }
    "@cf/google/gemma-4-26b-a4b-it": { supported_reasoning_efforts: [none, max] }
    "@cf/nvidia/nemotron-3-120b-a12b": { supported_reasoning_efforts: [none, max] }
    # qwq-32b, deepseek-r1-distill-qwen-32b, and qwen3-30b-a3b-fp8 always reason at max and drop request effort.
    "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b": { supported_reasoning_efforts: [max] }
    "@cf/qwen/qwen3-30b-a3b-fp8": { supported_reasoning_efforts: [max] }
    # Image input: FLUX.2 edits with up to 4 input images, in daedalus/photos.
    "*flux-2*": { supports_vision: true }
    # Clef answers typed questions with probabilities, not chat text, although Workers AI lists it as text.
    "@cf/cloudflare/clef*": { mode: decisions }
    # Clairic extracts typed values, not chat text, although Workers AI lists it as text too.
    "@cf/cloudflare/clairic*": { mode: decisions }

cohere:
  api_key: env:COHERE_API_KEY
  # Trial keys: 1,000 requests a month, 20 requests a minute for each chat model.
  rpm: 20
  # Free on a trial key: the key type sets free, not the model. Keep chat rows only.
  exclude:
    - "embed-*"
    - "rerank-*"
    - "parse-*"
    - "*transcribe*"
    - "*translate*"
  tier:
    TIER-B:
      - "command-a-*"
    TIER-C:
      - "command-r-*"
      - "north-mini-code-*"
      - "c4ai-aya-*"
    TIER-D:
      - "command-r7b-*"
      - "tiny-aya-*"
  models:
    c4ai-aya-expanse-32b: { max_input_tokens: 128000, max_output_tokens: 4000 }
    c4ai-aya-vision-32b: { max_input_tokens: 16384, max_output_tokens: 4000, supports_vision: true }
    command-a-03-2025: { max_input_tokens: 256000, max_output_tokens: 8000 }
    command-a-plus-05-2026: { max_input_tokens: 128000, max_output_tokens: 8000 }
    command-a-reasoning-08-2025: { max_input_tokens: 256000, max_output_tokens: 8000 }
    command-a-vision-07-2025: { max_input_tokens: 128000, max_output_tokens: 8000, supports_vision: true }
    command-r-08-2024: { max_input_tokens: 128000, max_output_tokens: 4000 }
    command-r-plus-08-2024: { max_input_tokens: 128000, max_output_tokens: 4000 }
    command-r7b-12-2024: { max_input_tokens: 128000, max_output_tokens: 4000 }
    north-mini-code-1.0: { max_input_tokens: 256000, max_output_tokens: 8000 }
    tiny-aya-earth: { max_input_tokens: 8192, max_output_tokens: 8000 }
    tiny-aya-fire: { max_input_tokens: 8192, max_output_tokens: 8000 }
    tiny-aya-global: { max_input_tokens: 8192, max_output_tokens: 8000 }
    tiny-aya-water: { max_input_tokens: 8192, max_output_tokens: 8000 }

gemini:
  api_key: env:GEMINI_API_KEY
  reasoning_effort: high
  exclude:
    - aqa
    - "*nano-banana*"
    - veo*
    - "*robotics*"
    - antigravity*
    - "*-latest"
    - gemini-2.5-*
    - gemini-3.1-pro-preview*
    - gemini-3.5-flash # Google deprecated the model
    - gemini-3.7-flash* # Google deprecated the model
    - gemini-4*
    - deep-research*
    - "*omni*"
    - "*-image*"
    - "*-live*"
    - lyria-*
    - genie-4 # world simulation model (WebRTC video), not chat
  tier:
    TIER-A:
      - gemini-3.8-flash
      - gemini-4-hydrogen
    TIER-B:
      - gemini-3.6-flash
      - gemma-4-*
    TIER-C:
      - gemini-3.1-flash*
      - gemini-3.5-flash-lite*
      - gemini-3-flash-preview
  models:
    # Gemini 3.8 flash rejects MINIMAL, while 3.x flash and gemma-4 accept minimal to high.
    gemini-3-flash-preview: { rpm: 5, tpm: 250000 }
    gemini-3.1-flash-lite: { rpm: 15, tpm: 250000, supported_reasoning_efforts: [minimal, low, medium, high] }
    gemini-3.1-flash-lite-preview: { rpm: 15, tpm: 250000, supported_reasoning_efforts: [minimal, low, medium, high] }
    gemini-3.5-flash-lite: { rpm: 15, tpm: 250000, supported_reasoning_efforts: [minimal, low, medium, high] }
    gemini-3.6-flash: { rpm: 5, tpm: 250000, supported_reasoning_efforts: [minimal, low, medium, high] }
    gemini-3.8-flash: { rpm: 5, tpm: 250000, supported_reasoning_efforts: [low, medium, high] }
    gemini-4-hydrogen: { rpm: 5, tpm: 250000, supported_reasoning_efforts: [minimal, low, medium, high] }
    gemma-4-26b-a4b-it: { rpm: 30, tpm: 16000, supported_reasoning_efforts: [minimal, low, medium, high] }
    gemma-4-31b-it: { rpm: 30, tpm: 16000, supported_reasoning_efforts: [minimal, low, medium, high] }
    "gemini-3*-tts*": { mode: audio_speech, rpm: 3, tpm: 10000 }
    "gemini-3*-transcribe": { mode: audio_transcription, rpm: 3, tpm: 10000 }

groq:
  api_key: env:GROQ_API_KEY
  # The free limits of https://console.groq.com/docs/rate-limits
  rpm: 30
  tpm: 8000
  exclude:
    - "*prompt-guard*"
    - "*safeguard*"
  tier:
    TIER-A:
      - qwen/qwen3.8-27b
    TIER-B:
      - openai/gpt-oss-20b
      - openai/gpt-oss-120b
    TIER-D:
      - allam-2-7b
  models:
    openai/gpt-oss-120b: { max_input_tokens: 7000 }
    openai/gpt-oss-20b: { max_input_tokens: 7000 }
    qwen/qwen3.8-27b:
      max_input_tokens: 7000
      max_output_tokens: 16384
      # Model docs name these three rungs, while the Groq deployment lists no effort set.
      supported_reasoning_efforts: [low, medium, high]
    # allam-2-7b has a 4096 combined window, so the input cap leaves room for the output.
    allam-2-7b: { max_input_tokens: 2048 }
    "whisper-*": { mode: audio_transcription, rpm: 20 }
    "*orpheus*": { mode: audio_speech, rpm: 10, tpm: 1200 }

kilo:
  api_key: env:KILO_API_KEY
  # Free models: 200 requests per IP per hour, https://kilo.ai/docs/gateway/usage-and-billing
  hourly_requests: 200
  discovery_match:
    isFree: true
  exclude:
    - "*content-safety*"
    - kilo-auto/free # router alias, not a single model
    - openrouter/free # router alias, not a single model

  # Kilo withdrew free tiers for glm-5, ling-3.0-flash, qwen3.8-27b, and step-3.7-flash.
  tier:
    TIER-A:
      - "nvidia/nemotron-3-super-*"
      - "poolside/laguna-s-*"
      - "thinkingmachines/inkling*"
      - "reflection/beam-*"
      - "minimax/minimax-m3.1-flash*"
    TIER-B:
      - "*" # every other model, while more specific patterns win
    TIER-C:
      - "recursive/flint-v1.0*"
    TIER-D:
      - "liquid/lfm-2.5-2.6b*"
      - "liquid/lfm-3-1.7b*"

openrouter:
  api_key: env:OPENROUTER_API_KEY
  exclude:
    - "*content-safety*"
    - recraft/* # image generation needs a credit balance, also for the :free ids
    - "!*:free"

  # OpenRouter keeps ling-3.0-flash, qwen3.8-27b, and step-3.7-flash only as paid variants.
  tier:
    TIER-A:
      - "nvidia/nemotron-3-super-*"
      - "nvidia/nemotron-3-ultra-*"
      - "poolside/laguna-s-*"
      - "thinkingmachines/inkling*"
      - "minimax/minimax-m3.1-flash*"
    TIER-B:
      - "*" # every other model, while more specific patterns win
    TIER-C:
      - "recursive/flint-v1.0*"
    TIER-D:
      - "liquid/lfm-2.5-2.6b*"

  models:
    # ERNIE returns its chain of thought as <ernie:think> tags inside content.
    "baidu/ernie-5.5-flash-preview:free":
      hooks:
        - on-chunk: hooks/ernie_think.py
        - on-answer: hooks/ernie_think.py

requesty:
  api_key: env:REQUESTY_API_KEY
  # Free tier: 200 requests a day, https://docs.requesty.ai/quickstart
  hourly_requests: 8
  tier:
    TIER-A:
      - "nvidia/nemotron-3-ultra-*"
    TIER-B:
      - "novita/ling-3.1-flash*"
    TIER-C:
      - "nvidia/nemotron-3.5-lightning-*"
      - "nvidia/muse-glimmer-*"
      - "google/gemma-4-31b-it"
    TIER-D:
      - "nvidia/nemotron-3-nano-omni-*"

sensenova:
  api_key: env:SENSENOVA_API_KEY
  # Free during the public beta: the tokenplan business. Keep chat rows only.
  exclude:
    - "*"
  tier:
    TIER-B:
      - "sensenova-6.8-flash"
    TIER-C:
      - "sensenova-6.8-flash-lite"
  models:
    sensenova-6.8-flash: { max_input_tokens: 262144, max_output_tokens: 65536 }
    sensenova-6.8-flash-lite: { max_input_tokens: 262144, max_output_tokens: 65536 }

vireonix:
  tier:
    TIER-B:
      - auto
z-ai:
  api_key: env:ZAI_API_KEY
  exclude:
    - "*"
  supports_reasoning: true
  supported_reasoning_efforts: [none, max]
  tier:
    TIER-B:
      - glm-4.5-flash
      - glm-4.7-flash
    TIER-D:
      - glm-4.6v-flash
  models:
    glm-4.5-flash: { max_input_tokens: 131072, max_output_tokens: 98304, rpm: 60, tpm: 8000 }
    glm-4.6v-flash: { max_input_tokens: 131072, max_output_tokens: 98304, rpm: 60, tpm: 8000 }
    glm-4.7-flash: { max_input_tokens: 131072, max_output_tokens: 131072, rpm: 60, tpm: 8000 }
