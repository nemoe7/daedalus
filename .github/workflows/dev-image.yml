name: Dev Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A new push to main cancels the older dev build. The release build keeps its own group.
concurrency:
  group: dev-image
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  image:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: dev
        name: Resolve Dev Version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          short="$(git rev-parse --short "$SHA")"
          printf 'short=%s\n' "$short" >>"$GITHUB_OUTPUT"
          printf 'version=dev-%s\n' "$short" >>"$GITHUB_OUTPUT"

      # QEMU builds the arm64 image for the Raspberry Pi.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ steps.dev.outputs.version }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.dev.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The rolling dev tag moves, so each build leaves an old dev-COMMIT version behind.
      # Keep the newest 10. A release tag or latest never starts with dev-, so it stays.
      - name: Prune Old Dev Versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: 10
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          PACKAGE="${REPO#*/}"
          if gh api "orgs/$OWNER" >/dev/null 2>&1; then
            scope="orgs/$OWNER"
          else
            scope="users/$OWNER"
          fi
          versions="$scope/packages/container/$PACKAGE/versions"
          mapfile -t stale < <(
            gh api --paginate "$versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | any(startswith("dev-"))) | "\(.created_at) \(.id)"' \
              | sort -r | tail -n +$((KEEP + 1)) | cut -d' ' -f2
          )
          for id in "${stale[@]}"; do
            gh api --method DELETE "$versions/$id"
          done
          echo "Deleted ${#stale[@]} old dev versions."
