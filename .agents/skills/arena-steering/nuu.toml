# Dedicated arena-steering preview configuration.

[design]
path = "docs/arena-steering/design.md"

[fonts]
sans = '"baselGrotesk", "baselGrotesk Fallback", ui-sans-serif, system-ui, sans-serif'
mono = '"baselGroteskMono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace'
files = [
  "assets/Basel_Grotesk_Book.woff2",
  "assets/Basel_Grotesk_Regular.woff2",
  "assets/Basel_Grotesk_Medium.woff2",
  "assets/Basel_Grotesk_Bold.woff2",
  "assets/Basel_Grotesk_Mono_Regular.woff2",
]

[annotate]
scale = 2
renderer = "auto"

[board]
stylesheet = "assets/style.css"
columns = 2
scale = 2
wireframe = false

[audit]
named_breakpoints = ["75em", "60em", "40em", "30em"]
viewports = ["1372x883", "855x325", "411x799"]
widths = [1372, 855, 411]
report_widths = [1372, 411]
wireframe = false
