# Router settings overrides. Missing keys use defaults from docs/configuration.md.
# DAEDALUS_HOST, DAEDALUS_PORT, and HEADROOM_URL configure network binding and compression.

# Open WebUI chat IDs stay in daedalus unless forward_owui_chat_id is true.
# privacy: # nonemo: NMP101
#   forward_owui_chat_id: false

# The hook files of the repo. The Settings page lists them and takes the selected 1s.
hooks:
  sources:
    - repo: nemoe7/daedalus
      path: hooks
      ref: main
      auto_update: false
