[project]
name = "daedalus"
version = "0.1.0"
description = "Local OpenAI-compatible proxy"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.6",
]

[project.scripts]
daedalus = "daedalus.api:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["daedalus", "daedalus.providers"]

[tool.setuptools.package-data]
daedalus = ["artifacts/*.json", "artifacts/*-LICENSE.txt"]
