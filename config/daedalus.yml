# Router settings. Each key is optional; a missing key uses the value shown here.
# DAEDALUS_HOST and DAEDALUS_PORT set the address, for example in compose.yml.
# HEADROOM_URL turns on message compression through a Headroom sidecar.
timeouts:
  request: 600 # seconds to wait for an answer, for all attempts
  wait: 60 # seconds without data from the provider, keep-alive bytes excluded
  slow: 30 # a first token after this is slow; half of wait when missing
session_affinity:
  enabled: true
  change_on_draw: true # false: keep the current pin after a weighted first-tier draw
  idle: 3600 # seconds without a request, then the session model expires
  stay: 0.85 # in a session, the share of first-tier draws for the session model
weights:
  enabled: true # false: all weights stay at 1 and the chain keeps the usual order
  success: 1.5
  fault: 0.5
  slow: 0.75
  hourly: 1.212
  rate_limit: 0.75 # the weight factor for an HTTP 429
cooldown:
  first: 60 # seconds of the first cooldown of a 429 with no reset time
  longest: 21600 # each next 429 doubles the cooldown, up to this many seconds
loops:
  calls: 3 # repeated identical tool calls since the last user message
  repeats: 4 # consecutive copies of a repeated text passage
  shortest: 20 # shortest passage period, in characters
  longest: 2000 # longest passage period, in characters
pacing:
  enabled: true # false: the rpm and tpm of the provider files do not skip models
catalog:
  every: 6 # hours between rebuilds of the model catalog; 0 stops them
  anchor: 6 # local hour (TZ env var) that the rebuild times start from: 00, 06, 12 and 18
headroom:
  timeout: 5 # seconds for the full Headroom answer; after this, the original messages go to the provider
escalation:
  # Whole words or phrases in any case. A match in the last user message moves the daedalus/auto session tier 1 step up.
  keywords:
    - ultrathink
    - think hard
    - think harder
    - think deeply
    - think longer
    - root cause
    - race condition
    - memory leak
    - deadlock
    - security review
    - performance regression
    - audit
    - refactor
    - investigate
    - diagnose
    - code review
    - system design
    - optimize
    - debug
    - design
    - architecture
switch:
  # Whole words or phrases in any case. A match in the last user message gives the pool session another model of the same tier.
  keywords:
    - clanker
dashboard:
  theme: system # system follows the device; light or dark fixes it
  time_format: 24h # 24h or 12h, for each time on the dashboard
pools:
  # The name after daedalus/ that clients use for each pool. After a change, the old name gets HTTP 400.
  moros: moros
  koinos: koinos
  deinos: deinos
  sophos: sophos
  graphos: graphos
  photos: photos
