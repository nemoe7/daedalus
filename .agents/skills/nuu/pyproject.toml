[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuu"
version = "0.1.66"
description = "Design sheet and UI/UX inspection CLI."
requires-python = ">=3.11"

[project.scripts]
nuu = "nuu:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["nuu", "uiux", "measure", "annotate", "walk"]
