[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nemoizer"
version = "0.1.3"
description = "Prose, terminology, and test-assertion linter."
requires-python = ">=3.11"

[project.scripts]
nemoizer = "nemoize:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["nemoize", "prose", "markers"]
