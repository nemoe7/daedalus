name: Docker

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI", "Gemini Release Draft"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Whether to publish the rolling dev image or a release
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev
      tag:
        description: Release tag to build, such as v1.2.3. Release mode only
        required: false
        type: string

# Least privilege at the top. Each job asks for packages: write where it publishes.
permissions:
  contents: read

jobs:
  # A successful CI run on main publishes the rolling dev image. A new dev build
  # replaces an older one, so its group cancels.
  dev:
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'CI'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Publishing to GHCR needs more than read, so the job asks for it here.
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: docker-dev
      cancel-in-progress: true
    steps:
      # `main` is a fixed, trusted ref. The commit CI tested is compared, never
      # checked out, so no ref from the event reaches the checkout.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Pin the tested commit
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual="$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED" && "$actual" != "$EXPECTED" ]]; then
            echo "main is at $actual, but CI tested $EXPECTED" >&2
            exit 1
          fi

      - id: dev
        name: Resolve Dev Version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          short="$(git rev-parse --short "$SHA")"
          printf 'short=%s\n' "$short" >>"$GITHUB_OUTPUT"
          printf 'version=dev-%s\n' "$short" >>"$GITHUB_OUTPUT"

      # QEMU builds the arm64 image for the Raspberry Pi.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ steps.dev.outputs.version }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.dev.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The rolling dev tag moves, so each build leaves an old dev-COMMIT version behind.
      # Keep the newest 10. A release tag or latest never starts with dev-, so it stays.
      - name: Prune Old Dev Versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: 10
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          PACKAGE="${REPO#*/}"
          if gh api "orgs/$OWNER" >/dev/null 2>&1; then
            scope="orgs/$OWNER"
          else
            scope="users/$OWNER"
          fi
          versions="$scope/packages/container/$PACKAGE/versions"
          mapfile -t stale < <(
            gh api --paginate "$versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | any(startswith("dev-"))) | "\(.created_at) \(.id)"' \
              | sort -r | tail -n +$((KEEP + 1)) | cut -d' ' -f2
          )
          for id in "${stale[@]}"; do
            gh api --method DELETE "$versions/$id"
          done
          echo "Deleted ${#stale[@]} old dev versions."

  # A tag push, or a Gemini Release Draft that ran to the end, publishes the release
  # image. The job reads the approval itself and skips when the proposal was not
  # approved. 1 build at a time, so latest ends on the newest tag.
  release:
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'Gemini Release Draft')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Publishing to GHCR needs more than read, so the job asks for it here.
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: docker-release
      cancel-in-progress: false
    steps:
      - id: release
        name: Resolve Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag=""
          expected_sha=""
          skip="false"

          case "$EVENT_NAME" in
            push)
              tag="${GITHUB_REF_NAME}"
              ;;
            workflow_dispatch)
              tag="$DISPATCH_TAG"
              ;;
            workflow_run)
              if [[ "$RUN_CONCLUSION" != "success" ]]; then
                skip="true"
              else
                job_id="$(gh api --paginate \
                  "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                  --jq '.jobs[] | select(.name == "draft") | .id' | tail -n 1)"

                if [[ -z "$job_id" ]]; then
                  skip="true"
                else
                  approval_conclusion="$(gh api \
                    "repos/$REPOSITORY/actions/jobs/$job_id" \
                    --jq '.steps[] | select(.name == "Approve Proposal") | .conclusion' | tail -n 1)"

                  if [[ "$approval_conclusion" != "success" ]]; then
                    skip="true"
                  else
                    approval_line="$(gh api --allow-escape-sequences "repos/$REPOSITORY/actions/jobs/$job_id/logs" | \
                      sed -nE 's/.*Tag [\x60](v[0-9]+\.[0-9]+\.[0-9]+)[\x60] points to [\x60]([0-9a-f]{40})[\x60]\..*/\1 \2/p' | \
                      tail -n 1)"

                    if [[ -z "$approval_line" ]]; then
                      echo "Approved proposal tag not found in job logs" >&2
                      exit 1
                    fi

                    read -r tag expected_sha <<<"$approval_line"
                  fi
                fi
              fi
              ;;
          esac

          if [[ "$skip" != "true" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
            printf 'expected_sha=%s\n' "$expected_sha" >>"$GITHUB_OUTPUT"
          fi

          printf 'skip=%s\n' "$skip" >>"$GITHUB_OUTPUT"

      - if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - if: steps.release.outputs.skip != 'true'
        name: Verify Release Commit
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-list -n 1 "$TAG^{commit}")"
          if [[ -n "$EXPECTED_SHA" && "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Tag $TAG points to $actual_sha, expected $EXPECTED_SHA" >&2
            exit 1
          fi

      # QEMU builds the arm64 image for the Raspberry Pi.
      - if: steps.release.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4.4.0
      - if: steps.release.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4.4.1
      - if: steps.release.outputs.skip != 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest
      - if: steps.release.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.release.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
