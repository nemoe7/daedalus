cloudflare:
  api_key: os.environ/CLOUDFLARE_API_TOKEN
  exclude:
    - "*llama-guard*"
    - "*llama-3.2-11b-vision*"
    - "*deepseek-v4-flash-0731"
    - "*deepseek-v4-pro-0813"
    - "*glm-5.2"
    - "*glm-5.3"
    - "*glm-5.3-flash"
    - "*kimi-k2.6"
    - "*kimi-k2.7-code"
  tier:
    TIER-A:
      - "qwen3*"
      - "*deepseek-r1*"
      - "*nemotron-3-120b-a12b*"

  models:
    "@cf/qwen/qwq-32b": { max_input_tokens: 20000, max_output_tokens: 4000 }

gemini:
  api_key: os.environ/GEMINI_API_KEY
  exclude:
    - aqa
    - nano-banana*
    - veo*
    - "*transcribe*"
    - "*robotics*"
    - antigravity*
    - "*-latest"
    - gemini-2.5-pro
    - gemini-3.1-pro-preview*
    - gemini-pro-latest
    - deep-research*
    - "*computer-use*"
    - "*omni*"
    - "gemini-2.5-flash*"
    - "*-image*"
    - "*-live*"
    - "*-tts*"
  tier:
    TIER-A:
      - gemini-3.8-flash
      - gemini-3.7-flash
    TIER-B:
      - gemini-3.5-flash
      - gemini-3.6-flash
    TIER-C:
      - gemini-3.1-flash*
      - gemini-3.5-flash-lite*
      - gemini-3-flash-preview
  models:
    gemini-3-flash-preview: { rpm: 5, tpm: 250000 }
    gemini-3.1-flash-lite: { rpm: 15, tpm: 250000 }
    gemini-3.1-flash-lite-preview: { rpm: 15, tpm: 250000 }
    gemini-3.5-flash: { rpm: 5, tpm: 250000, reasoning_effort: medium }
    gemini-3.5-flash-lite: { rpm: 15, tpm: 250000 }
    gemini-3.6-flash: { rpm: 5, tpm: 250000, reasoning_effort: medium }
    gemini-3.7-flash: { rpm: 5, tpm: 250000, reasoning_effort: medium }
    gemini-3.8-flash: { rpm: 5, tpm: 250000, reasoning_effort: medium }
    gemma-4-26b-a4b-it: { rpm: 30, tpm: 16000 }
    gemma-4-31b-it: { rpm: 30, tpm: 16000 }

groq:
  api_key: os.environ/GROQ_API_KEY
  rpm: 30
  exclude:
    - "orpheus*"
    - "*prompt-guard*"
    - "*safeguard*"
    - compound*
  tier:
    TIER-B:
      - qwen3.8-27b
  models:
    openai/gpt-oss-120b: { max_input_tokens: 7000 }
    openai/gpt-oss-20b: { max_input_tokens: 7000, tpm: 8000 }
    qwen/qwen3.8-27b: { max_input_tokens: 7000, max_output_tokens: 16384 }
    allam-2-7b: { tpm: 6000 }

kilo:
  api_key: os.environ/KILO_API_KEY
  exclude:
    - free
    - "*content-safety*"
    - kilo-auto/*
    - "!*:free"
  tier:
    TIER-A:
      - "glm-5*"
    TIER-B:
      - "*"

mistral:
  api_key: os.environ/MISTRAL_API_KEY
  exclude:
    - "voxtral*"
    - codestral-latest
    - mistral-code-latest
    - mistral-code-fim-latest
    - ministral-3b-latest
    - ministral-8b-latest
    - ministral-14b-latest
    - mistral-small-latest
    - magistral-medium-latest
    - "mistral-medium*"
    - "mistral-vibe-cli-*"
    - "*embed*"
  tier:
    TIER-A:
      - "magistral-medium*"
    TIER-C:
      - "codestral*"
      - "leanstral*"

openrouter:
  api_key: os.environ/OPENROUTER_API_KEY
  exclude:
    - free
    - "*content-safety*"
    - openrouter/*
    - "!*:free"
  tier:
    TIER-B:
      - "*"
  models:
    "*gemma-4-26b-a4b-it:free": { reasoning_effort: low }
    "*gemma-4-31b-it:free": { reasoning_effort: low }

z-ai:
  api_key: os.environ/ZAI_API_KEY
  exclude:
    - "*"
  tier:
    TIER-A:
      - glm-4.5
      - glm-4.6
      - glm-4.7
      - glm-5
      - glm-5.1
      - glm-5.2
      - glm-5.3
    TIER-B:
      - glm-4.5-air
      - glm-4.5-flash
      - glm-4.6v-flash
      - glm-4.7-flash
      - glm-5-turbo
      - glm-5.3-flash
  models:
    glm-4.5-flash: { max_input_tokens: 131072, max_output_tokens: 98304, rpm: 60, tpm: 8000 }
    glm-4.6v-flash: { max_input_tokens: 131072, max_output_tokens: 98304, rpm: 60, tpm: 8000 }
    glm-4.7-flash: { max_input_tokens: 131072, max_output_tokens: 131072, rpm: 60, tpm: 8000 }
