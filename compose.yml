services:
  daedalus:
    build: .
    image: daedalus:local
    user: "${DAEDALUS_UID:-1000}:${DAEDALUS_GID:-1000}"
    ports:
      - "3357:3357"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./.daedalus-state:/app/.daedalus-state
      - ./config:/app/config:ro
    restart: unless-stopped
