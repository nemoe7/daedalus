name: Image

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["Gemini Release Draft"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

# 1 build at a time, so latest ends on the newest tag.
concurrency:
  group: image
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: release
        name: Resolve Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag=""
          expected_sha=""
          skip="false"

          case "$EVENT_NAME" in
            push)
              tag="${GITHUB_REF_NAME}"
              ;;
            workflow_dispatch)
              tag="$DISPATCH_TAG"
              ;;
            workflow_run)
              if [[ "$RUN_CONCLUSION" != "success" ]]; then
                skip="true"
              else
                job_id="$(gh api --paginate \
                  "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                  --jq '.jobs[] | select(.name == "draft") | .id' | tail -n 1)"

                if [[ -z "$job_id" ]]; then
                  skip="true"
                else
                  approval_conclusion="$(gh api \
                    "repos/$REPOSITORY/actions/jobs/$job_id" \
                    --jq '.steps[] | select(.name == "Approve Proposal") | .conclusion' | tail -n 1)"

                  if [[ "$approval_conclusion" != "success" ]]; then
                    skip="true"
                  else
                    approval_line="$(gh api --allow-escape-sequences "repos/$REPOSITORY/actions/jobs/$job_id/logs" | \
                      sed -nE 's/.*Tag [\x60](v[0-9]+\.[0-9]+\.[0-9]+)[\x60] points to [\x60]([0-9a-f]{40})[\x60]\..*/\1 \2/p' | \
                      tail -n 1)"

                    if [[ -z "$approval_line" ]]; then
                      echo "Approved proposal tag not found in job logs" >&2
                      exit 1
                    fi

                    read -r tag expected_sha <<<"$approval_line"
                  fi
                fi
              fi
              ;;
          esac

          if [[ "$skip" != "true" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
            printf 'expected_sha=%s\n' "$expected_sha" >>"$GITHUB_OUTPUT"
          fi

          printf 'skip=%s\n' "$skip" >>"$GITHUB_OUTPUT"

      - if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - if: steps.release.outputs.skip != 'true'
        name: Verify Release Commit
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-list -n 1 "$TAG^{commit}")"
          if [[ -n "$EXPECTED_SHA" && "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Tag $TAG points to $actual_sha, expected $EXPECTED_SHA" >&2
            exit 1
          fi

      # QEMU builds the arm64 image for the Raspberry Pi.
      - if: steps.release.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.release.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.release.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest
      - if: steps.release.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.release.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
