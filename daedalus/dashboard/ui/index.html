<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daedalus</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="ui/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ui/apple-touch-icon.png">
<link rel="manifest" href="ui/manifest.json">
</head>
<body>
<form class="card login" id="login" hidden>
  <div class="login-head">
    <img src="ui/logo.svg" alt="" width="72" height="72">
    <h1>daedalus<span class="yes">.</span></h1>
    <small id="login-version"></small>
  </div>
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password
    <span class="secret">
      <input name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="show-password" aria-pressed="false" aria-label="Show the password" title="Show the password">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
          <circle cx="12" cy="12" r="3"/>
          <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </button>
    </span>
    <small id="login-hint" hidden>The password is the master key, DAEDALUS_MASTER_KEY.</small>
  </label>
  <label class="check"><input name="remember" type="checkbox" checked> <span>Remember me for 30 days</span></label>
  <button class="primary" type="submit">Log in</button>
  <div class="message bad" id="login-message" role="alert"></div>
</form>

<dialog id="modal" class="modal" aria-labelledby="modal-title">
  <form method="dialog">
    <h3 id="modal-title"></h3>
    <p id="modal-message"></p>
    <label class="modal-field" id="modal-field" hidden><input id="modal-input" type="text" spellcheck="false" autocomplete="off" aria-label="Name"></label>
    <label class="modal-field" id="modal-field2" hidden><input id="modal-input2" type="text" spellcheck="false" autocomplete="off" aria-label="Value"></label>
    <div class="modal-actions">
      <button class="ghost" type="submit" value="cancel">Cancel</button>
      <button class="primary" id="modal-ok" type="submit" value="ok">Confirm</button>
    </div>
  </form>
</dialog>
<dialog id="model-modal" class="modal model-modal" aria-labelledby="model-modal-title">
  <form method="dialog">
    <h3 id="model-modal-title"></h3>
    <div id="model-modal-body"></div>
    <div class="modal-actions">
      <button class="ghost" type="submit" value="close">Close</button>
    </div>
  </form>
</dialog>

<div id="app" hidden>
  <header>
    <div class="brand"><img src="ui/logo.svg" alt="" width="34" height="34"><div>daedalus<span>.</span><small id="version"></small></div></div>
    <div class="tab-bar">
    <button class="ghost tab-step" id="nav-left" type="button" aria-label="Show the earlier tabs" hidden><span aria-hidden="true">&lsaquo;</span></button>
    <nav class="tabs" id="nav">
      <a href="#/" data-page="overview">Overview</a>
      <a href="#/requests" data-page="requests">Requests</a>
      <a href="#/models" data-page="models">Models<span class="count" id="nav-models"></span></a>
      <a href="#/limits" data-page="limits">Limits</a>
      <a href="#/notifications" data-page="notifications">Notifications</a>
      <a href="#/providers" data-page="providers">Providers</a>
      <a href="#/settings" data-page="settings">Settings</a>
    </nav>
    <button class="ghost tab-step" id="nav-right" type="button" aria-label="Show the later tabs" hidden><span aria-hidden="true">&rsaquo;</span></button>
    </div>
    <div class="chips">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <span id="status" class="chips" data-status></span>
      <button class="ghost logout" id="logout" type="button">Log out</button>
    </div>
  </header>
  <main>
    <div class="notice" id="notice" role="alert" hidden>
      <span id="notice-text"></span>
      <button class="ghost" id="notice-retry" type="button"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /></svg> Try again</button>
      <button class="ghost" id="notice-close" type="button" aria-label="Dismiss the notice"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
    </div>
    <section data-page="overview" hidden>
      <div class="card kpis" id="ov-kpis"></div>
      <div class="flow">
        <div class="column">
          <!-- The status card rides in the grid, at the width of its neighbours. -->
          <div class="card status-card">
        <div class="status-head">
          <span class="status-health" id="card-health"></span>
        </div>
        <div class="status-rows" id="card-rows"></div>
      </div>
          <a class="card snippet" href="#/requests"><h3>Requests</h3><div id="ov-requests"></div></a>
          <a class="card snippet" href="#/limits"><h3>Limits</h3><div id="ov-limits"></div></a>
        </div>
        <div class="column">
          <a class="card snippet" href="#/models"><h3><span>Models<span class="count" id="ov-model-count"></span></span></h3><div id="ov-models"></div></a>
        </div>
      </div>
    </section>
    <section data-page="requests" hidden>
      <div class="flow">
        <div class="column wide">
          <div class="panel editbar requests-bar">
            <input type="search" id="request-search" placeholder="Filter">
            <select id="request-status" aria-label="Status">
              <option value="all">All statuses</option>
              <option value="ok">2xx only</option>
              <option value="bad">Errors only</option>
            </select>
            <select id="request-hours" aria-label="Time range">
              <option value="0">All time</option>
              <option value="1">Last hour</option>
              <option value="24">Last 24 hours</option>
            </select>
            <button class="ghost live-toggle" id="live-toggle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg> Live</button>
            <button class="ghost off" id="request-clear" type="button">Clear filters</button>
            <span class="hint" id="request-count"></span>
          </div>
          <div class="panel">
            <table class="requests" aria-label="Requests" role="table">
              <thead role="rowgroup"><tr role="row">
                <th scope="col" role="columnheader" title="When the request started">Time</th><th scope="col" role="columnheader" title="The client app, from its request headers">App</th><th scope="col" class="hide-sm" role="columnheader" title="The chat session that picked the model">Session</th><th scope="col" role="columnheader" title="The model asked for; the pool rides in the slug of an auto route">Model</th><th scope="col" role="columnheader" title="The model that answered, after any fallback">Served by</th><th scope="col" class="hide-sm" role="columnheader" title="The reasoning effort asked of the model">Effort</th>
                <th scope="col" role="columnheader" title="The status; 499 marks a request the client closed">Status</th><th scope="col" class="hide-sm" role="columnheader" title="Input tokens. ~ marks an estimate.">Input</th><th scope="col" class="hide-sm" role="columnheader" title="Output tokens from the provider">Output</th><th scope="col" class="hide-sm" role="columnheader" title="Time to the first token">TTFT</th><th scope="col" class="hide-sm" role="columnheader" title="The stream time after the first token">Stream</th>
              </tr></thead>
              <tbody id="live" role="rowgroup"></tbody>
              <tbody id="requests" role="rowgroup"></tbody>
            </table>
            <button class="ghost" id="more-requests" type="button" hidden>Show more</button>
          </div>
        </div>
        <div class="column">
          <div class="card legend" id="requests-legend">
            <h3>Code legend</h3>
            <div class="legend-body" id="legend-body"></div>
          </div>
        </div>
      </div>
    </section>
    <section data-page="models" hidden>
      <div class="panel editbar">
        <button class="ghost danger" id="reset-weights" type="button">Reset weights and cooldowns</button>
        <span class="message" id="reset-message" role="status"></span>
        <span class="hint">All weights go back to 1. All cooldowns end. Session models stay.</span>
      </div>
      <div class="pools" id="pools"></div>
      <div class="panel">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Filter by provider or slug">
          <select id="mode" aria-label="Model type">
            <option value="all">All types</option>
            <option value="chat">Chat</option>
            <option value="embedding">Embedding</option>
            <option value="audio_transcription">Transcription</option>
            <option value="audio_speech">Speech</option>
            <option value="image_generation">Image</option>
            <option value="video_generation">Video</option>
            <option value="decisions">Decisions</option>
            <option value="rerank">Rerank</option>
            <optgroup label="Media">
              <option value="vision">Image in</option>
              <option value="pdf_input">PDF in</option>
              <option value="audio_input">Audio in</option>
              <option value="audio_output">Audio out</option>
            </optgroup>
          </select>
          <div id="tiers"></div>
          <select id="sort-small" class="only-sm" aria-label="Sort">
            <option value="id">Sort: Model</option>
            <option value="tier">Sort: Tier</option>
            <option value="tools">Sort: Tools</option>
            <option value="cooldown">Sort: Cooldown</option>
            <option value="weight">Sort: Weight</option>
          </select>
        </div>
        <table class="models">
          <thead><tr id="model-head">
            <th data-sort="id"><button type="button" class="sort">Model</button></th>
            <th data-sort="mode" class="hide-sm"><button type="button" class="sort">Type</button></th>
            <th data-sort="tier"><button type="button" class="sort">Tier</button></th>
            <th data-sort="order" class="hide-sm" title="Higher orders run only when lower orders do not answer"><button type="button" class="sort">Order</button></th>
            <th data-sort="context" class="hide-sm"><button type="button" class="sort">Context</button></th>
            <th data-sort="tools"><button type="button" class="sort">Tools</button></th>
            <th data-sort="reasoning" class="hide-sm"><button type="button" class="sort">Reasoning</button></th>
            <th data-sort="cooldown"><button type="button" class="sort">Cooldown</button></th>
            <th data-sort="weight"><button type="button" class="sort">Weight</button></th>
          </tr></thead>
          <tbody id="models"></tbody>
        </table>
      </div>
    </section>
    <section data-page="notifications" hidden>
      <div class="flow">
        <div class="column wide">
          <div class="card notification-feed" id="notification-feed" aria-label="Notifications"></div>
        </div>
        <div class="column">
          <div class="card" id="update-card"></div>
        </div>
      </div>
    </section>
    <section data-page="limits" hidden>
      <div class="panel editbar">
        <button class="ghost" id="limits-check" type="button">Check now</button>
        <span class="search-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg></span><input type="search" id="limits-search" placeholder="Filter by model">
        <button class="ghost" id="limits-clear" type="button" hidden>Clear filters</button>
        <span class="message" id="limits-message" role="status"></span>
        <span class="hint" id="limits-checked"></span>
      </div>
      <div class="flow">
        <div class="column wide">
          <div class="panel">
            <table>
              <thead><tr>
                <th>Model</th><th>Limit</th><th>Left</th><th class="hide-sm">Reset</th><th class="hide-sm">Seen</th>
              </tr></thead>
              <tbody id="limit-rows"></tbody>
            </table>
          </div>
        </div>
        <div class="column" id="balances"></div>
      </div>
    </section>
    <section data-page="providers" hidden>
      <div class="files" id="files"></div>
      <div class="write-note" id="save-note" hidden>
        <span class="message" id="save-message" role="status"></span>
      </div>
      <div class="settings" id="provider-form"></div>
    </section>
    <section data-page="settings" hidden>
      <div class="write-note" id="settings-note" hidden>
        <span class="message" id="settings-message" role="status"></span>
      </div>
      <div class="settings" id="settings"></div>
    </section>
  </main>
</div>
<script src="ui/app.js"></script>
</body>
</html>
