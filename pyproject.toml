[project]
name = "daedalus"
version = "0.1.0"
description = "Local OpenAI-compatible proxy"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx2>=2.13",
  "ruff==0.16.6",
]

[project.scripts]
daedalus = "daedalus.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "daedalus",
  "daedalus.catalog",
  "daedalus.config",
  "daedalus.dashboard",
  "daedalus.providers",
  "daedalus.routing",
  "daedalus.server",
  "daedalus.store",
]

[tool.setuptools.package-data]
"daedalus.dashboard" = ["ui/*"]
"daedalus.routing" = ["artifacts/*.json", "artifacts/*-LICENSE.txt"]
