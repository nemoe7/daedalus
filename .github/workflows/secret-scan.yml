name: Secret scan

on:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request_target'
        name: Read the pinned PR objects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/pr_snapshot.py "$PR_NUMBER" "$PR_HEAD"
      - name: Install the pinned scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gitleaks"
          mkdir "$directory"
          gh release download v8.24.3 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.24.3_linux_x64.tar.gz \
            --pattern gitleaks_8.24.3_checksums.txt --dir "$directory"
          (cd "$directory" && grep ' gitleaks_8.24.3_linux_x64.tar.gz$' gitleaks_8.24.3_checksums.txt | sha256sum --check)
          tar -xzf "$directory/gitleaks_8.24.3_linux_x64.tar.gz" -C "$directory" gitleaks
      - name: Scan all history with the trusted policy
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --log-opts=--all .'
