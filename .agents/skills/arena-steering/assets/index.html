<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Steering</title>
  <link rel="manifest" href="/static/assets/manifest.webmanifest">
  <link rel="preload" href="/static/assets/Basel_Grotesk_Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/Basel_Grotesk_Book.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/Basel_Grotesk_Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/Basel_Grotesk_Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/Basel_Grotesk_Mono_Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="/static/assets/timestamps.js">
  <link rel="modulepreload" href="/static/assets/markdown.js">
  <link rel="modulepreload" href="/static/assets/api.js">
  <link rel="modulepreload" href="/static/assets/state.js">
  <link rel="modulepreload" href="/static/assets/modal.js">
  <link rel="modulepreload" href="/static/assets/dom.js">
  <link rel="modulepreload" href="/static/assets/icons.js">
  <link rel="modulepreload" href="/static/assets/messages-view.js">
  <link rel="modulepreload" href="/static/assets/tasks-view.js">
  <link rel="modulepreload" href="/static/assets/reports-view.js">
  <link rel="modulepreload" href="/static/assets/app.js">
  <link rel="stylesheet" href="/static/assets/style.css">
</head>
<body>
  <div id="steering-poll-state" hidden></div>
  <div class="app-shell">
    <header class="topbar">
      <h1 class="sr-only">Arena Steering</h1>
      <nav class="tab-nav" role="tablist" aria-label="Steering sections">
        <button type="button" class="tab-btn is-active" role="tab" aria-selected="true" data-tab="messages" id="tab-messages">
          Messages
        </button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="reports" id="tab-reports">
          Reports <span id="report-needs-answer" role="img" aria-label="Reports need answers" hidden><svg class="lucide lucide-circle-help report-picker-help-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></span><span class="tab-pip" id="report-pip" role="img" aria-label="No unread reports" hidden></span>
        </button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="tasks" id="tab-tasks">
          Tasks
        </button>
      </nav>
      <div class="topbar-actions row tight">
        <button id="blocked-bash-open" class="icon-button quiet-btn" type="button" aria-label="Blocked Bash log" title="Blocked Bash log">
          <svg class="lucide lucide-terminal" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="3" width="20" height="18" rx="2"></rect><path d="m6 8 4 4-4 4M12 16h6"></path></svg>
        </button>
        <button id="agent-interrupt" aria-pressed="false" aria-busy="false" class="icon-button quiet-btn" type="button" aria-label="Flag violation" title="Flag violation">
          <svg class="lucide lucide-flag" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"></path></svg>
        </button>
        <p id="violation-status" class="violation-status" role="alert" hidden></p>
      </div>
    </header>

    <main class="main-content" id="main-root" data-loading="false">
      <section id="view-messages" role="tabpanel" aria-labelledby="tab-messages"></section>
      <section id="view-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden></section>
      <section id="view-reports" role="tabpanel" aria-labelledby="tab-reports" hidden></section>
    </main>
  </div>

  <dialog id="image-modal" class="image-modal" aria-label="Image viewer">
    <button id="image-modal-close" class="icon-button quiet-btn image-modal-close" type="button" aria-label="Close image viewer">
      <!-- Lucide Icons - ISC License -->
      <svg class="lucide lucide-x" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
    <div id="image-modal-stage" class="image-modal-stage"></div>
  </dialog>

  <dialog id="modal-shell" class="modal-shell" aria-labelledby="modal-title">
    <form method="dialog" class="modal-card">
      <header class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="close-button icon-button quiet-btn" id="modal-close" type="submit" value="cancel" aria-label="Close dialog">
          <!-- Lucide Icons - ISC License -->
          <svg class="lucide lucide-x" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-actions" class="modal-actions"></footer>
    </form>
  </dialog>

  <template data-modal-template="confirm-delete">
    <p data-slot="message"></p>
    <div data-slot="actions">
      <button type="submit" value="cancel" class="btn btn-secondary">Cancel</button>
      <button type="submit" value="confirm" class="btn btn-danger">Confirm</button>
    </div>
  </template>

  <template data-modal-template="navigation-error">
    <p data-slot="message"></p>
    <div data-slot="actions">
      <button type="submit" value="cancel" class="btn btn-secondary">Close</button>
    </div>
  </template>

  <template data-modal-template="violation-flag">
    <div id="violation-form" class="violation-form">
      <label for="violation-reason">Violation type</label>
      <select id="violation-reason" class="select" required></select>
      <label for="violation-clause-file">Clause file (optional)</label>
      <select id="violation-clause-file" class="select"></select>
      <label for="violation-msg">Cited reason (optional)</label>
      <textarea id="violation-msg" class="textarea" rows="3" placeholder="Which clause, and what happened?"></textarea>
      <p id="violation-error" class="violation-error" role="alert" hidden></p>
    </div>
    <div data-slot="actions">
      <button type="submit" value="cancel" formnovalidate class="btn btn-secondary">Cancel</button>
      <button id="violation-submit" type="button" class="btn btn-primary">Send flag</button>
    </div>
  </template>

  <template data-modal-template="blocked-bash-log">
    <div class="blocked-bash-content">
      <p id="blocked-bash-status" role="status">Loading blocked Bash calls…</p>
      <div id="blocked-bash-log" class="blocked-bash-log" role="region" aria-label="Blocked Bash entries" tabindex="0"></div>
    </div>
    <div data-slot="actions">
      <button type="submit" value="cancel" class="btn btn-secondary">Close</button>
    </div>
  </template>

  <template data-modal-template="survey-results">
    <div data-slot="content" class="survey-modal-content"></div>
    <div data-slot="actions">
      <button id="survey-again" type="submit" value="bible-check" class="btn btn-secondary">
        <svg class="lucide lucide-rotate-ccw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        Survey again
      </button>
      <button type="submit" value="cancel" class="btn btn-secondary">Close</button>
    </div>
  </template>

  <script src="/static/assets/prism.min.js"></script>
  <script src="/static/assets/mermaid.min.js"></script>
  <script type="module" src="/static/assets/app.js"></script>
</body>
</html>
