services:
  daedalus:
    build: .
    image: daedalus:local
    container_name: daedalus
    user: "${DAEDALUS_UID:-1000}:${DAEDALUS_GID:-1000}"
    environment:
      DAEDALUS_HOST: 0.0.0.0
      DAEDALUS_PORT: 3357 # keep the container port below in step
      # Daedalus sends the messages here first. When Headroom does not run, the original messages go on.
      HEADROOM_URL: ${HEADROOM_URL-http://headroom:8787}
    ports:
      - "3357:3357"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./.daedalus-state:/app/.daedalus-state
      - ./config:/app/config # read-write: the dashboard edits and reloads these files
    restart: unless-stopped

  # Optional profiles. Set COMPOSE_PROFILES in .env, or use: docker compose --profile NAME up -d

  open-webui:
    profiles: [webui]
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: daedalus-webui
    environment:
      OPENAI_API_BASE_URL: http://daedalus:3357/v1
      OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-${DAEDALUS_MASTER_KEY:-}}
      ENABLE_OLLAMA_API: "false"
      # Sends X-OpenWebUI-Chat-Id, so a try again on daedalus/auto moves up 1 tier.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # Keeps the logins after an image update. Empty: a new key in each new container.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      AIOHTTP_CLIENT_TIMEOUT: "600" # keep at or above timeouts.request
      TASK_MODEL_EXTERNAL: daedalus/auto
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_MODEL: daedalus/graphos
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_MODEL: daedalus/photos
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - daedalus
    restart: unless-stopped

  headroom:
    profiles: [headroom]
    image: ghcr.io/headroomlabs-ai/headroom:0.39.1-slim # distroless: no shell
    container_name: daedalus-headroom
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1" # else Headroom answers the Daedalus container with 404
      HEADROOM_TELEMETRY: "off"
      HEADROOM_BEACON: "off" # the anonymous upload, on by default
      HEADROOM_UPDATE_CHECK: "off"
      HOME: /home/nonroot
      HEADROOM_WORKSPACE_DIR: /home/nonroot/.headroom
    volumes:
      - headroom:/home/nonroot # the image user owns this folder, so the new volume is writable
    restart: unless-stopped # no port: only Daedalus connects to it

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:latest
    container_name: daedalus-tailscale
    hostname: ${TS_HOSTNAME:-daedalus}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-daedalus}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json # https://NAME.TAILNET.ts.net to Daedalus, tailnet only
      TS_AUTH_ONCE: "true" # log in with TS_AUTHKEY only when the state has no login
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - daedalus
    restart: unless-stopped

volumes:
  open-webui:
  headroom:
  tailscale:
