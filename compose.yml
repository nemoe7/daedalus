services:
  api:
    # The image of the Docker workflow. compose.dev.yml builds it from the source.
    image: ghcr.io/nemoe7/daedalus:latest
    container_name: daedalus-api
    user: "${DAEDALUS_UID:-1000}:${DAEDALUS_GID:-1000}"
    env_file:
      - path: ./services/api/defaults.env
      - path: ./.env
        required: false
      - path: ./services/api/local.env
        required: false
    ports:
      - "${DAEDALUS_HOST_PORT:-3357}:3357"
    volumes:
      - ./.daedalus-state:/app/.daedalus-state
      - hooks:/app/hooks
      - ./config:/app/config # read-write: the dashboard edits and reloads these files
    restart: unless-stopped

  # Optional profiles. Set COMPOSE_PROFILES in .env, or use: docker compose --profile NAME up -d

  open-webui:
    profiles: [webui]
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: daedalus-webui
    env_file:
      - path: ./services/open-webui/defaults.env
      - path: ./services/open-webui/local.env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-${DAEDALUS_MASTER_KEY:-}}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      AUDIO_STT_OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-${DAEDALUS_MASTER_KEY:-}}
      IMAGES_OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-${DAEDALUS_MASTER_KEY:-}}
      IMAGES_EDIT_OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-${DAEDALUS_MASTER_KEY:-}}
      PGVECTOR_DB_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD:-openwebui}@webui-db:5432/openwebui
      RAG_OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-${DAEDALUS_MASTER_KEY:-}}
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      api:
        condition: service_started
      webui-db:
        condition: service_healthy
      tika:
        condition: service_started
        required: false # the tika profile is optional
    restart: unless-stopped

  webui-db:
    profiles: [webui]
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: daedalus-webui-db
    env_file:
      - path: ./services/webui-db/defaults.env
      - path: ./services/webui-db/local.env
        required: false
    environment:
      POSTGRES_PASSWORD: ${OPENWEBUI_DB_PASSWORD:-openwebui}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openwebui", "-d", "openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - webui-db:/var/lib/postgresql # PostgreSQL 18 keeps its data below this folder
    restart: unless-stopped # no port: only Open WebUI connects to it

  tika:
    profiles: [tika]
    image: apache/tika:3.3.0.0-full
    container_name: daedalus-tika
    command: ["-noFork"] # 1 Java process instead of a watchdog and a parser
    env_file:
      - path: ./services/tika/defaults.env
      - path: ./services/tika/local.env
        required: false
    restart: unless-stopped # no port: only Open WebUI connects to it

  searxng:
    profiles: [search]
    image: searxng/searxng:2026.9.25-12f8b6515
    container_name: daedalus-searxng
    env_file:
      - path: ./services/searxng/defaults.env
      - path: ./services/searxng/local.env
        required: false
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng:/var/cache/searxng
    restart: unless-stopped # no port: only Open WebUI connects to it

  headroom:
    profiles: [headroom]
    image: ghcr.io/headroomlabs-ai/headroom:0.40.0-slim # distroless: no shell
    container_name: daedalus-headroom
    command: ["--host", "0.0.0.0", "--port", "8787"]
    env_file:
      - path: ./services/headroom/defaults.env
      - path: ./services/headroom/local.env
        required: false
    volumes:
      - headroom:/home/nonroot # the image user owns this folder, so the new volume is writable
    restart: unless-stopped # no port: only api connects to it

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:latest
    container_name: daedalus-tailscale
    hostname: ${TS_HOSTNAME:-daedalus}
    env_file:
      - path: ./services/tailscale/defaults.env
      - path: ./services/tailscale/local.env
        required: false
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-daedalus}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - tailscale:/var/lib/tailscale
      - ./services/tailscale:/config:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  tailscale-openwebui:
    profiles: [tailscale-openwebui]
    image: tailscale/tailscale:latest
    container_name: daedalus-tailscale-owui
    hostname: ${TS_HOSTNAME_OWUI:-owui}
    env_file:
      - path: ./services/tailscale-openwebui/defaults.env
      - path: ./services/tailscale-openwebui/local.env
        required: false
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_OWUI:-${TS_AUTHKEY:-}}
      TS_HOSTNAME: ${TS_HOSTNAME_OWUI:-owui}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - tailscale-owui:/var/lib/tailscale
      - ./services/tailscale-openwebui:/config:ro
    depends_on:
      open-webui:
        condition: service_started
    restart: unless-stopped

volumes:
  hooks:
  open-webui:
  webui-db:
  searxng:
  headroom:
  tailscale:
  tailscale-owui:
