# Router settings. Each key is optional; a missing key uses the value shown here.
# DAEDALUS_HOST and DAEDALUS_PORT set the address, for example in compose.yml.
# HEADROOM_URL turns on message compression through a Headroom sidecar.
timeouts:
  request: 600 # seconds for one full request
  wait: 60 # seconds without bytes from the provider
  slow: 30 # a first token after this is slow; half of wait when missing
session_affinity:
  enabled: true
  idle: 3600 # seconds without a request, then the session model expires
  stay: 0.85 # in a session, the share of first-tier draws for the session model
weights:
  enabled: true # false: all weights stay at 1 and the chain keeps the usual order
  success: 1.5
  fault: 0.5
  slow: 0.75
  hourly: 1.212
  rate_limit: 0.75 # the weight factor for an HTTP 429
cooldown:
  first: 60 # seconds of the first cooldown of a 429 with no reset time
  longest: 21600 # each next 429 doubles the cooldown, up to this many seconds
pacing:
  enabled: true # false: the rpm and tpm of the provider files do not skip models
catalog:
  every: 6 # hours between rebuilds of the model catalog; 0 stops them
  anchor: 6 # local hour (TZ env var) that the rebuild times start from: 00, 06, 12 and 18
headroom:
  timeout: 5 # seconds for Headroom; after this, the original messages go to the provider
escalation:
  # Whole words or phrases in any case. A match in the last user message moves the daedalus/auto session tier 1 step up.
  keywords:
    - ultrathink
    - think hard
    - think harder
    - think deeply
    - think longer
    - root cause
    - race condition
    - memory leak
    - deadlock
    - security review
    - performance regression
    - audit
    - refactor
    - investigate
    - diagnose
    - code review
    - system design
    - optimize
    - debug
    - design
    - architecture
