name: Dependency review

on:
  pull_request_target:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-review.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-review.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review the pull request
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: moderate

  audit:
    name: Audit the locked dependencies
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv export --frozen --no-hashes --no-emit-project --output-file requirements-audit.txt
      - run: uvx pip-audit --requirement requirements-audit.txt --strict --progress-spinner off
